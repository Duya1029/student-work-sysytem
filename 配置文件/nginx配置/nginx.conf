# ============================================================
# Nginx 配置文件 - 学生作业管理系统
# 功能：前端静态资源托管 + 后端 API 反向代理
# ============================================================

# Nginx 主配置文件（通常位于 conf/nginx.conf）

worker_processes  1;                          # 工作进程数（通常等于CPU核数）

events {
    worker_connections  1024;                  # 每个工作进程的最大连接数
}

http {
    include       mime.types;                  # MIME 类型配置
    default_type  application/octet-stream;

    # 日志格式
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    sendfile        on;                         # 开启高效文件传输模式
    keepalive_timeout  65;                       # 保持连接的超时时间

    # gzip 压缩配置
    gzip  on;
    gzip_min_length  1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # ============================================================
    # 学生作业管理系统 - 服务器配置
    # ============================================================
    server {
        listen       80;                         # 监听 80 端口
        server_name  localhost;                   # 服务器名（可改为域名）

        # 前端静态资源（Vue 3 打包后的 dist 目录）
        # 将前端项目执行 npm run build 生成的 dist 目录复制到以下路径
        root  "C:/Users/28467/homework-system/frontend/dist";
        index  index.html;

        # 前端路由 - Vue Router History 模式支持
        # 所有非文件请求都指向 index.html，由前端路由处理
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ============================================================
        # 后端 API 反向代理配置
        # 所有 /api/** 请求转发到后端 Spring Boot (Tomcat 8080)
        # ============================================================
        location /api/ {
            proxy_pass http://localhost:8090;     # 后端 Tomcat 服务器地址
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # 静态资源缓存配置
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # 错误页面配置
        error_page  404 /index.html;             # 404 转由前端路由处理

        # access_log  logs/homework.access.log  main;  # 访问日志
        # error_log   logs/homework.error.log;          # 错误日志
    }
}
